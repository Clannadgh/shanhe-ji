<script src="../js/00-core.js"></script>

<script>
window.runBench = function (n) {
  var out = [];
  for (var i = 0; i < n; i++) {
    var t = performance.now();
    var w = AO.generate({ seed: 'bench-' + i, width: 2400, height: 1200, provinces: 1100, countries: 64, landRatio: 0.38 });
    out.push([Math.round(performance.now() - t), Math.round(w.meta.timing.terrain), Math.round(w.meta.timing.geometry)]);
  }
  return out;
};
</script>
</body></html>
