<!-- ============ 军事科技（v4）：17 条军事科技 + 皮甲 ============
     同一套家法。构图语言按枝分族，小尺寸辨识靠"每张差一个大剪影特征"：
       冷兵器 = 单件武器大特写（胸甲 / 斜置短剑 / 交叉双剑 / 十字弩）
       火器   = 枪形侧视，结构点一支比一支递进：
                蛇形杆+枪口火 → 垂下火绳卷 → 燧石击锤+刺刀 → 火帽+米涅弹
                → 开膛+黄铜壳 → 栓动+五连弹排
