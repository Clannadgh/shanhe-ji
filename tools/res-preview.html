<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
  body{margin:0;background:#dfe8ea;font:12px/1.4 "Microsoft YaHei",sans-serif;color:#2b3238}
  .pair{display:flex;gap:10px;padding:10px 12px}
  .pair .col{flex:1;display:flex;flex-wrap:wrap;gap:8px}
  .pair .col > div{text-align:center;width:96px}
  .cap{font-size:11px;color:#5b6a70;padding:6px 12px 0;font-weight:700}
  .row{display:flex;align-items:center;gap:12px;padding:6px 12px;border-top:1px solid #c9d4d8}
  .row .lab{width:72px;color:#5b6a70}
  .cell{display:flex;align-items:center;gap:5px}
  .cell em{font-style:normal;color:#8b9aa1;font-size:10px}
  img{display:block}
</style></head><body>
<div class="cap">未开发（地里那个东西）</div>
<div class="pair" id="raw"></div>
<div class="cap">已开发（开发之后变成什么）</div>
<div class="pair" id="dev"></div>
<div class="cap">建筑（开发要盖什么）</div>
<div class="pair" id="bld"></div>
<div id="rows"></div>
<script>
const keys=[['iron','铁矿','铁锭','铁矿场'],['gold','金矿','金锭','金矿场'],['grain','耕地','粮食','农场'],['horse','畜牧','牲畜','牧场'],['timber','林木','木材','伐木场'],['fish','渔获','渔获','渔港'],['salt','盐','盐','盐场']];
const sizes=[15,16,18,22,28];
const raw=document.getElementById('raw'), dev=document.getElementById('dev'),
      bld=document.getElementById('bld'), rows=document.getElementById('rows');
for(const [k,cn,dn,bn] of keys){
  raw.insertAdjacentHTML('beforeend',`<div><img src="../assets/res/item-${k}.png" width="96" height="96"><div>${cn}</div></div>`);
  dev.insertAdjacentHTML('beforeend',`<div><img src="../assets/res/item-${k}-dev.png" width="96" height="96"><div>${dn}</div></div>`);
  bld.insertAdjacentHTML('beforeend',`<div><img src="../assets/res/item-${k}-bld.png" width="96" height="96"><div>${bn}</div></div>`);
  const r=document.createElement('div');r.className='row';
  r.innerHTML=`<span class="lab">${bn}</span>`+sizes.map(s=>`<span class="cell"><img src="../assets/res/item-${k}-bld.png" width="${s}" height="${s}"><em>${s}</em></span>`).join('');
  rows.appendChild(r);
}
</script></body></html>
